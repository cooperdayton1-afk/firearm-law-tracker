name: Colorado Bill Progress

on:
  schedule:
    - cron: '0 2 * * *'  # 7am Denver time (MDT, UTC-6)
  workflow_dispatch:

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install requests python-dotenv supabase

      - name: Refresh bill status, committee, and session info
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/update_bill_progress.py
